<?xml version="1.0" encoding="utf-8"?>
<!-- Exercises semantic colors and nested geometry using redistributable shapes. -->
<svg viewBox="0 0 40 40" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="content_clip">
      <rect x="0" y="0" width="20" height="20" />
    </clipPath>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="40" height="40" fill="#0000ff" />
  </g>
  <g id="outline" transform="translate(4 4)" clip-path="url(#content_clip)">
    <rect x="0" y="0" width="32" height="32" fill="#ff0000" />
    <g id="inner_text" transform="translate(8 8)" opacity="0.5">
      <rect x="0" y="0" width="16" height="16" fill="#00ff00" />
    </g>
  </g>
</svg>
