      <circle cx="10" cy="30" r="8"/>
    </clipPath>
    <clipPath id="ellipse-clip">
      <ellipse cx="30" cy="30" rx="8" ry="5"/>
    </clipPath>
  </defs>
  <circle id="circle" cx="10" cy="10" r="8" fill="#FF4A4B"/>
