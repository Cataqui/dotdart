name: dotdart_example
description: Runnable example for dotdart-generated SVG, Lottie, and raster widgets.
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.15.0
  dotdart:
    path: ../
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

dotdart:
  output: lib/gen/
  svg:
    - assets/icons/
  lottie:
    - assets/lotties/
  image:
    - assets/images/

flutter:
  uses-material-design: true
  assets:
    - assets/images/
