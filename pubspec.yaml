name: dotdart
description: Type-safe Flutter asset access that compiles SVG, Lottie, and images into optimized Dart widgets.
version: 0.6.2
homepage: https://github.com/Cataqui/dotdart
repository: https://github.com/Cataqui/dotdart
issue_tracker: https://github.com/Cataqui/dotdart/issues
documentation: https://github.com/Cataqui/dotdart/tree/main/doc
topics:
  - flutter
  - assets
  - codegen
  - lottie
  - svg

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  build: ^4.0.0
  dart_style: ^3.0.0
  flutter:
    sdk: flutter
  glob: ^2.1.3
  image: ^4.8.0
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=7.0.0 <11.0.0"
